    <script>
        const textInput = document.getElementById('textInput');
        const paperContent = document.getElementById('paper-content');
        const fontSelect = document.getElementById('fontSelect');
        const paperSelect = document.getElementById('paperSelect');
        const colorPicker = document.getElementById('colorPicker');
        const sizeRange = document.getElementById('sizeRange');
        const sizeVal = document.getElementById('sizeVal');
        const opacityRange = document.getElementById('opacityRange');
        const opacityVal = document.getElementById('opacityVal');
        const paper = document.getElementById('handwriting-paper');

        // Live Preview Logic
        function updatePreview() {
            paperContent.innerText = textInput.value;
            paperContent.style.fontFamily = fontSelect.value;
            paperContent.style.color = colorPicker.value;
            paperContent.style.fontSize = sizeRange.value + 'px';
            paperContent.style.opacity = opacityRange.value / 100;
            
            // Paper Style
            paper.className = paperSelect.value;
            
            sizeVal.innerText = sizeRange.value + 'px';
            opacityVal.innerText = opacityRange.value + '%';
        }

        textInput.addEventListener('input', updatePreview);
        fontSelect.addEventListener('change', updatePreview);
        paperSelect.addEventListener('change', updatePreview);
        colorPicker.addEventListener('input', updatePreview);
        sizeRange.addEventListener('input', updatePreview);
        opacityRange.addEventListener('input', updatePreview);

        function clearAll() {
            textInput.value = "";
            updatePreview();
        }

        async function download(format) {
            const canvas = await html2canvas(paper);
            const imgData = canvas.toDataURL('image/png');
            
            if (format === 'png' || format === 'jpg') {
                const link = document.createElement('a');
                link.download = `handwriting.${format}`;
                link.href = canvas.toDataURL(`image/${format === 'png' ? 'png' : 'jpeg'}`);
                link.click();
            } else if (format === 'pdf') {
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('p', 'mm', 'a4');
                const imgProps = pdf.getImageProperties(imgData);
                const pdfWidth = pdf.internal.pageSize.getWidth();
                const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;
                pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
                pdf.save('handwriting.pdf');
            }
        }
        
        // Initial load
        updatePreview();
    </script>
